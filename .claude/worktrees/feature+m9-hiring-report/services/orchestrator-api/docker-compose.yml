services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: arap
      POSTGRES_PASSWORD: arap
      POSTGRES_DB: arap_dev
    ports:
      - "5433:5432"
    volumes:
      - arap_pgdata:/var/lib/postgresql/data

  db-test:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: arap
      POSTGRES_PASSWORD: arap
      POSTGRES_DB: arap_test
    ports:
      - "5434:5432"

volumes:
  arap_pgdata:
